; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
; Arduino-ESP32 core 2.0.x; the SuperMini uses the C3 DevKitM-1 board definition
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; ESP32-C3 runs at 160 MHz max (240 MHz is an S3/ESP32 setting)
board_build.f_cpu = 160000000L
; SuperMini flash chips are happiest in DIO mode
board_build.flash_mode = dio

; Serial over the native USB port (the SuperMini has no USB-UART chip)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600

; WiFi, WiFiUdp, Wire and Preferences come with the core.
; The BMP280 is read directly over Wire in HeightFusion.h: no library.
lib_deps =
    pololu/VL53L0X@^1.3.1
    tomstewart89/BasicLinearAlgebra@^5.1
    madhephaestus/ESP32Servo@^3.0.5